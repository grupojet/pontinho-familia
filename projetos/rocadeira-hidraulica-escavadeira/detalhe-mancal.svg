<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 830" font-family="Arial, Helvetica, sans-serif" font-size="12">
  <style>
    .s{stroke:#111;stroke-width:2;fill:none}
    .st{fill:#cfd4d9;stroke:#111;stroke-width:2}
    .sh{fill:#8a9097;stroke:#111;stroke-width:2}
    .br{fill:#f0c674;stroke:#111;stroke-width:1.5}
    .sl{fill:#333;stroke:#111;stroke-width:1}
    .mt{fill:#9aa6b2;stroke:#111;stroke-width:2}
    .cl{stroke:#1b5fb8;stroke-width:1;stroke-dasharray:14 4 3 4;fill:none}
    .dim{stroke:#1b5fb8;stroke-width:1;fill:none}
    .dt{fill:#1b5fb8;font-size:12px}
    .h{fill:#333;font-size:12px}
    .T{fill:#111;font-weight:bold}
    .hatch{fill:url(#hz);stroke:#111;stroke-width:2}
  </style>
  <defs>
    <pattern id="hz" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#555" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1100" height="830" fill="#fff"/>
  <text x="20" y="30" font-size="18" class="T">Detalhe 01 — Conjunto eixo porta-facas e mancal (Opção A, versão padrão Ø60)</text>
  <text x="20" y="50" class="h">Corte longitudinal · escala livre · cotas em mm · tolerâncias ISO 2768-mK salvo indicação</text>

  <!-- eixo de simetria -->
  <line x1="420" y1="80" x2="420" y2="720" class="cl"/>

  <!-- MOTOR (parcial) -->
  <rect x="340" y="90" width="160" height="70" class="mt"/>
  <text x="352" y="130" class="h">MOTOR A2FM 125 (flange SAE)</text>
  <!-- eixo estriado do motor -->
  <rect x="405" y="160" width="30" height="40" class="sl"/>

  <!-- placa adaptadora 25 mm -->
  <rect x="270" y="200" width="300" height="25" class="hatch"/>
  <text x="580" y="217" class="h">① Placa adaptadora 25 mm, A36 — furação SAE do motor + 8× M16 p/ mancal</text>

  <!-- luva estriada -->
  <rect x="395" y="175" width="50" height="75" class="sh"/>
  <text x="580" y="243" class="h">② Luva estriada bipartida (estria motor ↔ estria eixo) — ou Rotex 48</text>

  <!-- tampa superior + retentor -->
  <rect x="300" y="225" width="240" height="20" class="hatch"/>
  <rect x="380" y="232" width="18" height="10" fill="#444"/><rect x="442" y="232" width="18" height="10" fill="#444"/>
  <text x="580" y="262" class="h">③ Tampa superior 20 mm c/ retentor 55×80×10 e graxeira</text>

  <!-- carcaça (tubo Ø150x20, furo Ø110 H7) -->
  <rect x="305" y="245" width="40" height="260" class="hatch"/>
  <rect x="495" y="245" width="40" height="260" class="hatch"/>
  <text x="580" y="330" class="h">④ Carcaça: tubo Ø150 × 20, L = 260, furo Ø110 H7</text>
  <text x="580" y="346" class="h">    (alojamentos nas duas pontas, batente central Ø104 usinado)</text>

  <!-- batente central interno -->
  <rect x="345" y="355" width="12" height="40" class="hatch"/>
  <rect x="483" y="355" width="12" height="40" class="hatch"/>

  <!-- rolamentos cônicos 32212 (sup e inf) montagem em O -->
  <g>
    <polygon points="345,262 380,262 383,296 345,296" class="br"/>
    <polygon points="495,262 460,262 457,296 495,296" class="br"/>
    <polygon points="345,455 383,455 380,489 345,489" class="br"/>
    <polygon points="495,455 457,455 460,489 495,489" class="br"/>
  </g>
  <text x="580" y="288" class="h">⑤ 2× rolamento de rolos cônicos 32212 (60×110×29,75) — montagem em "O"</text>
  <text x="580" y="304" class="h">    pré-carga por porca KM12 + arruela MB12, rosca M60×2 no eixo</text>

  <!-- porca KM12 -->
  <rect x="388" y="250" width="64" height="12" class="sh"/>

  <!-- eixo -->
  <rect x="397" y="250" width="46" height="300" class="sh"/>           <!-- Ø60 trecho rolamentos -->
  <rect x="390" y="296" width="60" height="159" class="sh"/>           <!-- Ø65 ressalto central -->
  <rect x="403" y="175" width="34" height="75" class="sh"/>            <!-- Ø55 ponta estriada -->
  <rect x="397" y="489" width="46" height="75" class="sh"/>            <!-- Ø60 abaixo rol. inferior -->
  <text x="580" y="400" class="h">⑥ Eixo SAE 1045 beneficiado (Sy ≥ 450 MPa)</text>
  <text x="580" y="416" class="h">    Ø55 estria DIN 5480 W55×2×26 (topo) · Ø60 k6 assentos (2×) ·</text>
  <text x="580" y="432" class="h">    Ø65 ressalto central · flange inferior Ø220 × 25 integral ou</text>
  <text x="580" y="448" class="h">    prensado+soldado · raios de concordância R2 mín. nos ressaltos</text>

  <!-- tampa inferior + retentor -->
  <rect x="300" y="505" width="240" height="20" class="hatch"/>
  <rect x="380" y="512" width="17" height="10" fill="#444"/><rect x="443" y="512" width="17" height="10" fill="#444"/>
  <text x="580" y="468" class="h">⑦ Tampa inferior 20 mm c/ retentor 60×90×10 (lábio p/ baixo) e defletor</text>

  <!-- flange base do mancal soldado ao tubo -->
  <rect x="230" y="470" width="75" height="20" class="hatch"/>
  <rect x="535" y="470" width="75" height="20" class="hatch"/>
  <text x="580" y="540" class="h">⑧ Flange base Ø300 × 20 soldado ao tubo (filete 10 mm, ambos os lados),</text>
  <text x="580" y="556" class="h">    8× Ø18 em CF Ø260 → M16 cl. 10.9 na chapa de reforço do deck</text>

  <!-- chapa de reforço + deck -->
  <rect x="120" y="490" width="185" height="10" fill="#f3b5a8" stroke="#111"/>
  <rect x="120" y="500" width="185" height="6" fill="#d9442b" stroke="#111"/>
  <rect x="535" y="490" width="185" height="10" fill="#f3b5a8" stroke="#111"/>
  <rect x="535" y="500" width="185" height="6" fill="#d9442b" stroke="#111"/>
  <text x="125" y="522" class="h">chapa reforço 9,5 + deck original</text>

  <!-- flange do eixo + disco -->
  <rect x="330" y="564" width="180" height="22" class="sh"/>
  <rect x="200" y="586" width="440" height="12" class="st"/>
  <text x="650" y="580" class="h">⑨ Flange do eixo Ø220 × 25 — furação igual ao disco porta-facas original</text>
  <text x="650" y="596" class="h">⑩ Disco porta-facas e facas originais, 6× M16 cl. 10.9 c/ trava</text>
  <!-- parafusos disco -->
  <g fill="#222"><rect x="345" y="560" width="8" height="42"/><rect x="487" y="560" width="8" height="42"/></g>

  <!-- COTAS -->
  <!-- comprimento carcaça -->
  <line x1="260" y1="245" x2="260" y2="505" class="dim"/>
  <line x1="252" y1="245" x2="300" y2="245" class="dim"/><line x1="252" y1="505" x2="300" y2="505" class="dim"/>
  <text x="200" y="380" class="dt">260</text>
  <!-- entre centros rolamentos -->
  <line x1="285" y1="279" x2="285" y2="472" class="dim"/>
  <line x1="280" y1="279" x2="345" y2="279" class="dim" stroke-dasharray="3 3"/><line x1="280" y1="472" x2="345" y2="472" class="dim" stroke-dasharray="3 3"/>
  <text x="278" y="380" class="dt" transform="rotate(-90 278 380)">193 (entre centros rol.)</text>
  <!-- balanço -->
  <line x1="240" y1="472" x2="240" y2="592" class="dim"/>
  <line x1="232" y1="592" x2="330" y2="592" class="dim" stroke-dasharray="3 3"/>
  <text x="150" y="565" class="dt">150 (balanço)</text>
  <!-- diâmetros -->
  <line x1="305" y1="640" x2="535" y2="640" class="dim"/>
  <line x1="305" y1="634" x2="305" y2="646" class="dim"/><line x1="535" y1="634" x2="535" y2="646" class="dim"/>
  <text x="395" y="656" class="dt">Ø150 (tubo) · furo Ø110 H7</text>
  <line x1="397" y1="672" x2="443" y2="672" class="dim"/>
  <line x1="397" y1="666" x2="397" y2="678" class="dim"/><line x1="443" y1="666" x2="443" y2="678" class="dim"/>
  <text x="380" y="690" class="dt">Ø60 k6</text>
  <line x1="330" y1="706" x2="510" y2="706" class="dim"/>
  <line x1="330" y1="700" x2="330" y2="712" class="dim"/><line x1="510" y1="700" x2="510" y2="712" class="dim"/>
  <text x="385" y="724" class="dt">Ø220 (flange)</text>
  <!-- altura total -->
  <line x1="760" y1="90" x2="760" y2="598" class="dim"/>
  <line x1="752" y1="90" x2="768" y2="90" class="dim"/><line x1="752" y1="598" x2="768" y2="598" class="dim"/>
  <text x="768" y="110" class="dt">≈ 560 (topo motor → disco)</text>

  <!-- notas -->
  <text x="20" y="760" class="h">Notas: a) Lubrificação: graxa EP2, encher 2/3 da câmara; relubrificar a cada 50 h pela graxeira da tampa superior.</text>
  <text x="20" y="776" class="h">b) Pré-carga: apertar KM12 até torque de giro de 1,5–2,5 N·m no eixo, travar MB12. c) Furo de respiro Ø4 na tampa superior.</text>
  <text x="20" y="792" class="h">d) Versão reforçada (troncos > 50 mm): eixo Ø80 em SAE 4140, rolamentos 32216 (80×140×33), tubo Ø180 × 20 furo Ø140 H7, flange Ø240 × 30.</text>
  <text x="20" y="808" class="h">e) Balancear o conjunto eixo + flange + disco + facas antes da montagem final (qualidade G16 ou melhor).</text>
</svg>
